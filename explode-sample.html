<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuwon's Clickable Explosion 💥</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .yuwon-character {
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .yuwon-character:hover {
            transform: scale(1.05);
        }

        .yuwon-character:active {
            transform: scale(0.95);
        }

        .yuwon-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 15px;
            border: none;
            box-shadow: none;
            transition: transform 0.3s ease;
        }

        .click-counter {
            display: none;
        }

        .dialogue-bubble {
            background: white;
            border: 2px solid #ddd;
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            max-width: 300px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: bounce 0.5s ease;
        }

        .dialogue-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 12px solid white;
        }

        .dialogue-bubble::before {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 14px solid #ddd;
            z-index: -1;
        }

        .explosion-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .explosion-gif {
            max-width: 80vw;
            max-height: 80vh;
        }

        .reset-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .reset-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .hidden {
            display: none;
        }

        @keyframes bounce {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            10% { transform: translateX(-8px) translateY(-3px) rotate(-3deg); }
            20% { transform: translateX(8px) translateY(3px) rotate(3deg); }
            30% { transform: translateX(-10px) translateY(-5px) rotate(-4deg); }
            40% { transform: translateX(10px) translateY(5px) rotate(4deg); }
            50% { transform: translateX(-12px) translateY(-7px) rotate(-5deg); }
            60% { transform: translateX(12px) translateY(7px) rotate(5deg); }
            70% { transform: translateX(-8px) translateY(-3px) rotate(-3deg); }
            80% { transform: translateX(8px) translateY(3px) rotate(3deg); }
            90% { transform: translateX(-4px) translateY(-2px) rotate(-2deg); }
        }

        .shake {
            animation: shake 0.6s ease-in-out;
        }

        .intense-shake {
            animation: shake 0.4s ease-in-out infinite;
        }

        .enlarge-before-explosion {
            animation: enlargeAndTremble 1.5s ease-in-out forwards;
        }

        @keyframes enlargeAndTremble {
            0% { transform: scale(1); }
            60% { transform: scale(1.3) rotate(-2deg); }
            70% { transform: scale(1.35) rotate(2deg); }
            80% { transform: scale(1.4) rotate(-3deg); }
            90% { transform: scale(1.45) rotate(3deg); }
            100% { transform: scale(1.5) rotate(0deg); }
        }

        /* Confetti Animation - Exploding from center */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff0000;
            animation: confetti-explode 2s ease-out forwards;
            z-index: 999;
            border-radius: 2px;
        }

        .confetti:nth-child(odd) {
            background: #ff4444;
        }

        .confetti:nth-child(3n) {
            background: #ff6666;
            width: 8px;
            height: 8px;
        }

        .confetti:nth-child(4n) {
            background: #cc0000;
            width: 12px;
            height: 12px;
        }

        .confetti:nth-child(5n) {
            background: #ff8888;
            border-radius: 50%;
        }

        @keyframes confetti-explode {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: var(--confetti-direction) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="click-counter">
            Clicks: <span id="clickCount">0</span>/5
        </div>
        
        <div class="dialogue-bubble" id="dialogueBubble">
            Hi there! I'm Yuwon~ Want to be friends? 💕
        </div>
        
        <div class="yuwon-character" id="yuwonCharacter">
            <img src="assets/images/characters/corneryuwon_neutral.png" alt="Yuwon" class="yuwon-image" id="yuwonImage">
        </div>
        
        <button class="reset-button hidden" id="resetButton">
            Bring Yuwon Back! ✨
        </button>
    </div>

    <div class="explosion-container hidden" id="explosionContainer">
        <img src="assets/images/characters/explode.gif" alt="Explosion" class="explosion-gif">
    </div>

    <audio id="explosionSound" preload="auto">
        <source src="assets/images/roblox-explosion-sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const yuwonCharacter = document.getElementById('yuwonCharacter');
        const yuwonImage = document.getElementById('yuwonImage');
        const dialogueBubble = document.getElementById('dialogueBubble');
        const clickCountElement = document.getElementById('clickCount');
        const explosionContainer = document.getElementById('explosionContainer');
        const explosionSound = document.getElementById('explosionSound');
        const resetButton = document.getElementById('resetButton');
        
        let clickCount = 0;
        
        const dialogues = [
            "Hi there! I'm Yuwon~ Want to be friends? 💕",
            "Hehe, that's nice! But maybe don't poke so hard? 😊",
            "Um... okay, I think that's enough now... 😅",
            "H-Hey! Stop that! You're making me dizzy! 😰",
            "I'm serious! Stop clicking me or else...! 😡",
            "AHHHHH! YOU'VE DONE IT NOW—! 💥"
        ];
        
        // Perfect Yuwon expression progression!
        const yuwonImages = [
            "assets/images/characters/corneryuwon_neutral.png",    // Start: neutral
            "assets/images/characters/corneryuwon_happy.png",      // Click 1: happy/tickled
            "assets/images/characters/corneryuwon_oh.png",         // Click 2: surprised 
            "assets/images/characters/corneryuwon_fearful.png",    // Click 3: getting worried
            "assets/images/characters/corneryuwon_angry.png",      // Click 4: angry warning
            "assets/images/characters/corneryuwon_verysad.png"     // Click 5: crying before explosion!
        ];
        
        yuwonCharacter.addEventListener('click', function() {
            if (clickCount < 5) {
                clickCount++;
                
                // Update dialogue
                dialogueBubble.textContent = dialogues[clickCount];
                
                // Change Yuwon's expression 
                if (clickCount < yuwonImages.length) {
                    yuwonImage.src = yuwonImages[clickCount];
                }
                
                // Intensifying shake effects
                yuwonCharacter.classList.remove('shake', 'intense-shake');
                
                if (clickCount >= 4) {
                    // Super intense shaking for angry states
                    yuwonCharacter.classList.add('intense-shake');
                    setTimeout(() => {
                        yuwonCharacter.classList.remove('intense-shake');
                    }, 1000);
                } else {
                    // Regular shake that gets longer each time
                    yuwonCharacter.classList.add('shake');
                    setTimeout(() => {
                        yuwonCharacter.classList.remove('shake');
                    }, 300 + (clickCount * 100));
                }
                
                // If this is the 5th click, prepare for explosion!
                if (clickCount === 5) {
                    setTimeout(() => {
                        prepareExplosion();
                    }, 1000);
                }
            }
        });
        
        function prepareExplosion() {
            // Stop the intense shaking
            yuwonCharacter.classList.remove('intense-shake');
            
            // Start enlarging and trembling
            yuwonCharacter.classList.add('enlarge-before-explosion');
            
            // Wait for enlargement to finish, then explode
            setTimeout(() => {
                explodeYuwon();
            }, 1500);
        }
        
        function explodeYuwon() {
            // Create confetti burst
            createConfetti();
            
            // Hide Yuwon and dialogue
            yuwonCharacter.classList.add('hidden');
            dialogueBubble.classList.add('hidden');
            
            // Show explosion
            const explosionImg = explosionContainer.querySelector('img');
            explosionContainer.classList.remove('hidden');
            
            // Play explosion sound
            explosionSound.currentTime = 0;
            explosionSound.play().catch(e => {
                console.log('Audio play failed:', e);
            });
            
            // Control explosion gif to play only once
            explosionImg.onload = function() {
                setTimeout(() => {
                    explosionContainer.classList.add('hidden');
                    resetButton.classList.remove('hidden');
                }, 2000); // Show for 2 seconds (typical gif duration)
            };
            
            // Fallback in case onload doesn't fire
            setTimeout(() => {
                explosionContainer.classList.add('hidden');
                resetButton.classList.remove('hidden');
            }, 3000);
        }
        
        function createConfetti() {
            const colors = ['#ff0000', '#ff4444', '#ff6666', '#cc0000', '#ff8888'];
            const confettiCount = 40;
            
            // Get center position (where Yuwon was)
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Position at center
                confetti.style.left = centerX + 'px';
                confetti.style.top = centerY + 'px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                // Create random explosion direction
                const angle = (Math.PI * 2 * i) / confettiCount + (Math.random() - 0.5) * 0.5;
                const distance = 150 + Math.random() * 200; // Random distance 150-350px
                const deltaX = Math.cos(angle) * distance;
                const deltaY = Math.sin(angle) * distance;
                
                // Set CSS custom property for animation direction
                confetti.style.setProperty('--confetti-direction', 
                    `translate(${deltaX}px, ${deltaY}px)`);
                
                // Random animation duration
                confetti.style.animationDuration = (1.5 + Math.random() * 1) + 's';
                confetti.style.animationDelay = Math.random() * 0.3 + 's';
                
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    if (confetti.parentNode) {
                        confetti.remove();
                    }
                }, 3000);
            }
        }
        
        resetButton.addEventListener('click', function() {
            // Reset everything
            clickCount = 0;
            dialogueBubble.textContent = dialogues[0];
            yuwonImage.src = yuwonImages[0];
            
            // Remove any animation classes
            yuwonCharacter.classList.remove('enlarge-before-explosion', 'shake', 'intense-shake');
            
            // Show Yuwon and dialogue again
            yuwonCharacter.classList.remove('hidden');
            dialogueBubble.classList.remove('hidden');
            resetButton.classList.add('hidden');
        });
        
        // Preload explosion sound
        explosionSound.volume = 0.7; // Not too loud!
    </script>
</body>
</html>
